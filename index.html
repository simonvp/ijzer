<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IJzer — Workout &amp; Progress</title>
<meta name="theme-color" content="#0f1114">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <!-- screens are rendered here by app.js -->
  <div id="screen-root"></div>
</div>

<nav class="bottom-nav" id="mainNav">
  <button class="nav-item" data-route="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
    <span>Vandaag</span>
  </button>
  <button class="nav-item" data-route="calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/><circle cx="8.5" cy="14.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="14.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14.5" r="1.2" fill="currentColor" stroke="none"/></svg>
    <span>Kalender</span>
  </button>
  <button class="nav-item" data-route="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
    <span>Progressie</span>
  </button>
  <button class="nav-item" data-route="photos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M3 17l5-5 4 4 3-3 5 5"/></svg>
    <span>Foto's</span>
  </button>
  <button class="nav-item" data-route="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
    <span>Meer</span>
  </button>
</nav>

<div id="overlay-root"></div>

<!-- Chart.js for progress graphs (vendored locally for offline use) -->
<script src="js/vendor/chart.umd.min.js"></script>

<!-- Core -->
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>

<!-- App modules (attach to shared App namespace) -->
<script src="js/app-core.js"></script>
<script src="js/app-onboarding.js"></script>
<script src="js/app-dashboard.js"></script>
<script src="js/app-workout.js"></script>
<script src="js/app-kettlebell.js"></script>
<script src="js/app-calendar.js"></script>
<script src="js/app-progress.js"></script>
<script src="js/app-body.js"></script>
<script src="js/app-photos.js"></script>
<script src="js/app-settings.js"></script>
<script src="js/app-boot.js"></script>
</body>
</html>
